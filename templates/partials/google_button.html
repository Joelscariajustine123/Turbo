{% comment %}
  "Continue with Google" (Google Identity Services). Needs GOOGLE_OAUTH_CLIENT_ID; renders nothing otherwise.
  Usage: {% include "partials/google_button.html" with role="rider" text="continue_with" %}
{% endcomment %}
{% if GOOGLE_CLIENT_ID %}
<div class="divider"><span>Or</span></div>
<div class="turbo-google" data-role="{{ role }}" data-text="{{ text|default:'continue_with' }}"
     data-endpoint="{% url 'account:google_login' %}" data-next="{{ request.GET.next|default:'' }}"
     style="display:grid;justify-items:center;gap:8px;min-height:44px">
  <div class="turbo-google-btn"></div>
  <p class="turbo-google-error" role="alert" style="color:#f87171;font-size:.88rem;margin:0;text-align:center"></p>
</div>
<script>
  window.turboGoogleInit = function () {
    var box = document.querySelector('.turbo-google');
    if (!box || !window.google || !google.accounts) return;
    var err = box.querySelector('.turbo-google-error');
    var csrf = document.querySelector('[name=csrfmiddlewaretoken]');
    google.accounts.id.initialize({
      client_id: '{{ GOOGLE_CLIENT_ID|escapejs }}',
      ux_mode: 'popup',
      callback: function (resp) {
        err.textContent = '';
        fetch(box.dataset.endpoint, {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf ? csrf.value : '' },
          body: JSON.stringify({ credential: resp.credential, role: box.dataset.role, next: box.dataset.next }),
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (x) {
            if (x.ok && x.d.redirect) window.location.href = x.d.redirect;
            else err.textContent = (x.d && x.d.detail) || 'Google sign-in failed. Please try again.';
          })
          .catch(function () { err.textContent = 'Could not reach the server. Please try again.'; });
      },
    });
    var btn = box.querySelector('.turbo-google-btn');
    google.accounts.id.renderButton(btn, {
      theme: 'filled_black', size: 'large', shape: 'pill', text: box.dataset.text,
      width: Math.min(360, Math.max(240, box.offsetWidth || 320)),
    });
  };
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="turboGoogleInit()"></script>
{% endif %}
