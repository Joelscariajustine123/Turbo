{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turbo Cab - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'account/css/riderlogin.css' %}" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h2 class="title">Log in</h2>
      {% include "partials/messages.html" %}
      <form action="" method="POST" class="login-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}" />
        <div class="input-group">
          <label>Email address</label>
          <div class="input-box">
            <i class='bx bx-envelope'></i>
            <input type="email" placeholder="test@saberali.co" required name="email"/>
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-box">
            <i class='bx bx-lock'></i>
            <input type="password" placeholder="**********" required name="password"/>
            <!-- <i class='bx bx-low-vision eye-icon'></i> -->
          </div>
        </div>

        <div class="options">
          <label><input type="checkbox" name="remember" /> Remember me</label>
        </div>

        <button type="submit" class="sign-in-btn">Sign In</button>

        <div class="footer-text">
          Don't have an account? <a href="{% url 'account:rider_signup' %}">Sign up</a>
        </div>
        {% include "partials/google_button.html" with role="rider" text="continue_with" %}
      </form>
    </div>
  </div>
</body>
</html>
