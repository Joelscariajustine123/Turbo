{% extends 'driverpages/base.html' %}
{% block title %}Settings{% endblock %}
{% block content %}
<main class="content">
  <section class="settings">
    <h3><i class="bx bx-cog"></i> Driver Settings</h3>

    <form class="settings-form" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ driver.user.full_name }}" required>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="{{ driver.user.phone }}" pattern="[0-9]{10}" maxlength="10" title="10-digit phone number" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" value="{{ driver.user.email }}" required>
      </div>

      <!-- License Number -->
      <div class="form-group">
        <label for="license_number">License Number</label>
        <input type="text" id="license_number" name="license_number" value="{{ driver.license_number }}" required>
      </div>

      <!-- Vehicle -->
      <div class="form-group">
        <label for="vehicle_info">Vehicle model</label>
        <input type="text" id="vehicle_info" name="vehicle_info" value="{{ driver.vehicle_info }}" placeholder="e.g. Maruti Swift Dzire" required>
      </div>

      <div class="form-group">
        <label for="vehicle_number">Registration number</label>
        <input type="text" id="vehicle_number" name="vehicle_number" value="{{ driver.vehicle_number }}" placeholder="e.g. KL 13 AB 1234" maxlength="20" style="text-transform:uppercase">
      </div>

      <div class="form-group">
        <label for="vehicle_type">Vehicle type</label>
        <select id="vehicle_type" name="vehicle_type">
          <option value="">— Select —</option>
          {% for value, label in vehicle_types %}
          <option value="{{ value }}"{% if driver.vehicle_type == value %} selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Availability Status -->
      <div class="form-group">
        <label for="availability_status">Availability Status</label>
        <select id="availability_status" name="availability_status">
          {% for value, label in availability_choices %}
          <option value="{{ value }}"{% if driver.availability_status == value %} selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Profile Photo -->
      <div class="form-group">
        <label for="profile_photo">Upload Photo</label>
        <input type="file" id="profile_photo" name="profile_photo" accept="image/*">
        {% if driver.profile_photo %}
          <img src="{{ driver.profile_photo.url }}" alt="Current profile photo" width="100" height="100" style="margin-top: 10px; object-fit: cover; border-radius: 8px;">
        {% endif %}
      </div>

      <div class="form-group">
        <button type="submit" class="save-settings">Save Changes</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
