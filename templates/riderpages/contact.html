{% extends 'riderpages/base.html' %}
{% block title %}Contact{% endblock %}
{% block content %}

    <div class="container">
        <h2>Contact Us</h2>

        <div class="contact-details">
            <p><i class="fas fa-map-marker-alt"></i> anjarakandy 670612, kannur, kerala</p>
            <p><i class="fas fa-phone"></i> +1 (123) 456-7890</p>
            <p><i class="fas fa-envelope"></i> Turbocabs@gmail.com</p>
        </div>

        <form method="post" action="{% url 'riderpages:contact' %}">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Your Name" value="{{ form_data.name|default:'' }}" maxlength="100" required>
            <input type="email" name="email" placeholder="Your Email" value="{{ form_data.email|default:'' }}" required>
            <textarea name="message" rows="4" placeholder="Your Message" required>{{ form_data.message|default:'' }}</textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
{% endblock %}
