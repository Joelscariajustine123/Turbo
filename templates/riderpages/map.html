{% extends 'riderpages/base.html' %}
{% load static %}

{% block title %}Book a Ride{% endblock %}

{% block extra_head %}
    <!-- Leaflet Map & Plugin CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    

    <style>
        /* Base layout for the app container */
        .app-container {
            display: flex;
            height: calc(100svh - var(--nav-h));
            min-height: 560px;
            font-family: 'Inter', sans-serif;
        }

        /* Sidebar set to 50% width */
        .sidebar {
            width: 50%;
            background: var(--bg-2); border-right: 1px solid var(--line);
            color: #fff;
            padding: 2rem; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            font-size: 1.4rem;
            margin-bottom: 2rem;
            font-weight: 700;
            text-align: center;
        }

        .sidebar form label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #aaa;
        }

        .sidebar form input,
        .sidebar form select {
            width: 100%;
            height: 48px;
            padding: 0 0.8rem;
            line-height: 48px;
            border: 1px solid var(--line-strong);
            background-color: var(--bg);
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        
        .search-container {
            position: relative;
            margin-bottom: 1.2rem;
        }
        
        .search-container input {
            padding-right: 50px; 
            margin-bottom: 0;
        }
        
        .search-btn {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 50px;
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        
        .search-btn:hover {
            color: #fff;
        }

        .ride-summary {
            background-color: var(--surface);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            border: 1px solid var(--line); border-left: 3px solid var(--accent);
        }

        .ride-summary p {
            margin: 0.6rem 0;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }
        
        .ride-summary span {
            font-weight: 700;
        }

        #book-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5rem;
        }

        #book-btn:hover {
            background-color: #2f74e6;
        }

        #map {
            flex-grow: 1; 
            height: 100%;
            cursor: crosshair;
        }
        
        .leaflet-routing-container {
            display: none;
        }

        .autocomplete-container {
            position: relative;
        }

        .suggestions-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface-2);
            border: 1px solid #555;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 9999;
            margin-top: -1.2rem;
        }

        .suggestion-item {
            padding: 0.8rem;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #555;
        }
        
        .suggestion-item.message {
            cursor: default;
            color: #999;
        }
        
        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:not(.message):hover {
            background-color: var(--accent);
        }


        /* ---- Turbo theme layout ---- */
        .sidebar { width: 420px; flex-shrink: 0; padding: 28px; }
        .sidebar h2 { text-align: left; letter-spacing: .02em; font-size: 1.1rem; color: var(--text-2); margin-bottom: 1.5rem; }
        .sidebar form input:focus, .sidebar form select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
        .ride-summary { border-radius: 14px; }
        #book-btn { border-radius: 999px; box-shadow: 0 10px 30px -10px rgba(59,130,246,.8); }
        .suggestions-list { border-radius: 0 0 12px 12px; }
        @media (max-width: 800px) {
            .app-container { flex-direction: column; height: auto; }
            #map { order: -1; height: 46svh; min-height: 300px; flex-grow: 0; }
            .sidebar { width: 100%; height: auto; padding: 20px 16px 32px; border-right: 0; }
        }
    </style>
{% endblock %}

{% block footer %}{% endblock %}

{% block content %}
    <div class="app-container">
        
        <div class="sidebar">
            <form method="POST" action="{% url 'riderpages:map_view' %}" id="booking-form">
                {% csrf_token %}
                <h2>BOOK YOUR RIDE</h2>
                
                <label>Pickup</label>
                <input type="text" id="pickup" name="pickup" value="Getting your location..." readonly required style="margin-bottom: 1.2rem;" />

                <label>Drop</label>
                <div class="autocomplete-container">
                    <div class="search-container">
                        <input type="text" id="drop" name="drop" placeholder="Type to search for a place..." required autocomplete="off" />
                        <button type="button" id="search-btn" class="search-btn">🔍</button>
                    </div>
                    <div id="suggestions-box" class="suggestions-list"></div>
                </div>
                
                <label>Estimated Details</label>
                <div id="summary" class="ride-summary">
                    <p>Distance: <span><span id="distance">--</span> km</span></p>
                    <p>Fare: <span>₹<span id="fare">--</span></span></p>
                </div>
                
                <!-- NEW: Hidden inputs to send distance and fare to the server -->
                <input type="hidden" name="distance" id="hidden-distance" />
                <input type="hidden" name="fare" id="hidden-fare" />
                <!-- The server recalculates distance and fare from these coordinates. -->
                <input type="hidden" name="pickup_lat" id="pickup-lat" />
                <input type="hidden" name="pickup_lng" id="pickup-lng" />
                <input type="hidden" name="drop_lat" id="drop-lat" />
                <input type="hidden" name="drop_lng" id="drop-lng" />

                <label>Select Vehicle</label>
                <select id="car" name="car">
                    <option value="sedan" data-rate="{{ rates.sedan }}">🚘 Sedan (₹{{ rates.sedan }}/km)</option>
                    <option value="suv" data-rate="{{ rates.suv }}">🚙 SUV (₹{{ rates.suv }}/km)</option>
                    <option value="bike" data-rate="{{ rates.bike }}">🏍️ Bike (₹{{ rates.bike }}/km)</option>
                    <option value="auto" data-rate="{{ rates.auto }}">🛺 Auto (₹{{ rates.auto }}/km)</option>
                </select>

                <button type="submit" id="book-btn">CONFIRM BOOKING</button>
            </form>
        </div>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

    <script>
        const map = L.map('map').setView([11.8745, 75.3704], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const carSelect = document.getElementById('car');
        const distanceEl = document.getElementById('distance');
        const fareEl = document.getElementById('fare');
        const pickupInput = document.getElementById('pickup');
        const dropInput = document.getElementById('drop');
        const suggestionsBox = document.getElementById('suggestions-box');
        const searchBtn = document.getElementById('search-btn');
        // NEW: Get hidden input elements
        const hiddenDistanceInput = document.getElementById('hidden-distance');
        const hiddenFareInput = document.getElementById('hidden-fare');

        let pickupLatLng = null;
        let dropLatLng = null;
        let routingControl = null;
        let pickupMarker = null;
        let dropMarker = null;
        let geocodeTimeout;
        let lastDistanceMeters = null;

        map.locate({ setView: true, maxZoom: 16 });

        async function reverseGeocode(latlng) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.display_name || `Lat: ${latlng.lat.toFixed(4)}`;
            } catch (error) {
                console.error("Reverse geocoding failed:", error);
                return `Lat: ${latlng.lat.toFixed(4)}`;
            }
        }
        
        map.on('locationfound', async function(e) {
            pickupLatLng = e.latlng;
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker(pickupLatLng).addTo(map).bindPopup("Your Location").openPopup();
            pickupInput.value = await reverseGeocode(pickupLatLng);
        });

        map.on('locationerror', () => {
             pickupInput.value = "Location access denied.";
        });
        
        map.on('click', async function(e) {
            if (!pickupLatLng) return;
            dropLatLng = e.latlng;
            suggestionsBox.style.display = 'none';
            
            if (dropMarker) dropMarker.setLatLng(dropLatLng);
            else {
                dropMarker = L.marker(dropLatLng, { draggable: true }).addTo(map);
                dropMarker.on('dragend', (e) => handleDropMarkerDrag(e));
            }
            dropInput.value = await reverseGeocode(dropLatLng);
            calculateAndShowRoute();
        });
        
        async function handleDropMarkerDrag(e){
            dropLatLng = e.target.getLatLng();
            dropInput.value = await reverseGeocode(dropLatLng);
            calculateAndShowRoute();
        }
        
        async function triggerSearch() {
            const query = dropInput.value;
            if (!query) return;
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&viewbox=74.0,8.0,78.0,13.0&bounded=1`;
            try {
                const response = await fetch(url);
                const results = await response.json();
                if (results && results.length > 0) {
                    selectSuggestion(results[0]);
                } else {
                    alert('Location not found.');
                }
            } catch (error) {
                alert('Search failed.');
            }
        }

        function selectSuggestion(result) {
            dropInput.value = result.display_name;
            dropLatLng = L.latLng(result.lat, result.lon);
            suggestionsBox.style.display = 'none';
            if (dropMarker) dropMarker.setLatLng(dropLatLng);
            else {
                dropMarker = L.marker(dropLatLng, { draggable: true }).addTo(map);
                dropMarker.on('dragend', (e) => handleDropMarkerDrag(e));
            }
            if (pickupLatLng) map.fitBounds([pickupLatLng, dropLatLng], { padding: [50, 50] });
            else map.setView(dropLatLng, 14);
            calculateAndShowRoute();
        }

        // Enter in the search box should search, not submit the booking form.
        dropInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') e.preventDefault();
        });

        dropInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                triggerSearch();
                return;
            }
            const query = e.target.value;
            clearTimeout(geocodeTimeout);
            if (query.length < 3) {
                suggestionsBox.innerHTML = '';
                suggestionsBox.style.display = 'none';
                return;
            }
            geocodeTimeout = setTimeout(async () => {
                suggestionsBox.innerHTML = '<div class="suggestion-item message">Searching...</div>';
                suggestionsBox.style.display = 'block';
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&viewbox=74.0,8.0,78.0,13.0&bounded=1`;
                try {
                    const response = await fetch(url);
                    const results = await response.json();
                    suggestionsBox.innerHTML = '';
                    if (results && results.length > 0) {
                        results.forEach(result => {
                            const item = document.createElement('div');
                            item.className = 'suggestion-item';
                            item.textContent = result.display_name;
                            item.onclick = () => selectSuggestion(result);
                            suggestionsBox.appendChild(item);
                        });
                    } else {
                        suggestionsBox.innerHTML = '<div class="suggestion-item message">No results found.</div>';
                    }
                } catch (error) {
                     suggestionsBox.innerHTML = '<div class="suggestion-item message">Search failed.</div>';
                }
            }, 350);
        });
        
        searchBtn.addEventListener('click', triggerSearch);

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.autocomplete-container')) {
                suggestionsBox.style.display = 'none';
            }
        });

        function calculateAndShowRoute() {
            if (!pickupLatLng || !dropLatLng) return;
            if (routingControl) map.removeControl(routingControl);
            // Clear the old estimate until the new route comes back.
            lastDistanceMeters = null;
            hiddenDistanceInput.value = '';
            hiddenFareInput.value = '';
            routingControl = L.Routing.control({
                waypoints: [pickupLatLng, dropLatLng],
                lineOptions: { styles: [{ color: '#3b82f6', opacity: 0.85, weight: 6 }] },
                createMarker: () => null, show: false, addWaypoints: false
            }).addTo(map);
            routingControl.on('routesfound', (e) => {
                lastDistanceMeters = e.routes[0].summary.totalDistance;
                updateFare(lastDistanceMeters);
            });
        }
        
        function updateFare(distanceMeters) {
            const distanceKm = (distanceMeters / 1000).toFixed(2);
            const selectedCarOption = carSelect.options[carSelect.selectedIndex];
            const ratePerKm = parseFloat(selectedCarOption.getAttribute('data-rate'));
            const baseFare = {{ base_fare }};
            const estimatedFare = (parseFloat(distanceKm) * ratePerKm) + baseFare;
            
            distanceEl.textContent = distanceKm;
            fareEl.textContent = estimatedFare.toFixed(2);
            
            // NEW: Update the hidden inputs
            hiddenDistanceInput.value = distanceKm;
            hiddenFareInput.value = estimatedFare.toFixed(2);
        }

        carSelect.addEventListener('change', function() {
            if (lastDistanceMeters !== null) updateFare(lastDistanceMeters);
        });

        // Don't submit until a route (and therefore a distance) exists.
        document.getElementById('booking-form').addEventListener('submit', function(e) {
            if (!pickupLatLng || !dropLatLng || !hiddenDistanceInput.value) {
                e.preventDefault();
                alert('Please allow location access and choose a drop location, then wait for the fare to appear.');
                return;
            }
            document.getElementById('pickup-lat').value = pickupLatLng.lat;
            document.getElementById('pickup-lng').value = pickupLatLng.lng;
            document.getElementById('drop-lat').value = dropLatLng.lat;
            document.getElementById('drop-lng').value = dropLatLng.lng;
        });
    </script>
{% endblock %}
